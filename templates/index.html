<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Real-Time Network Monitor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    /* Same polished CSS as before */
    body { background: radial-gradient(circle at 18% 24%, #1e293b 0%, #0f172a 55%, #0b1120 100%); color: #e6eef8; min-height: 100vh; font-family: 'Inter', sans-serif; }
    .card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); border-radius: 1rem; padding: 1rem; transition: transform 0.2s; }
    .card:hover { transform: translateY(-2px); border-color: rgba(96, 165, 250, 0.4); }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #1e293b; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    .stat-number { font-variant-numeric: tabular-nums; }
    .blink { animation: blinker 1.5s linear infinite; }
    @keyframes blinker { 50% { opacity: 0; } }
  </style>
</head>

<body class="p-6">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <header class="flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-teal-300">
          ⚡ Network Monitor
        </h1>
        <div class="flex items-center gap-2 text-xs text-gray-400 mt-1">
          <div id="wsStatus" class="w-2 h-2 rounded-full bg-red-500"></div>
          <span id="wsStatusText">Disconnected</span>
        </div>
      </div>
      <div class="flex gap-3">
        <button onclick="showInterfaceModal()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded text-sm border border-slate-600">
          Select Interface
        </button>
        <button onclick="stopCapture()" class="bg-red-900/50 hover:bg-red-900/80 text-red-200 px-4 py-2 rounded text-sm border border-red-800">
          Stop
        </button>
      </div>
    </header>

    <div id="interfaceModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center backdrop-blur-sm">
      <div class="bg-slate-900 border border-slate-700 p-6 rounded-xl max-w-md w-full shadow-2xl">
        <h3 class="text-xl font-bold mb-4">Select Interface</h3>
        <div id="interfaceList" class="space-y-2 mb-4 max-h-60 overflow-y-auto custom-scroll">Loading...</div>
        <button onclick="document.getElementById('interfaceModal').classList.add('hidden')" class="w-full bg-slate-700 py-2 rounded">Cancel</button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="card">
        <div class="text-gray-400 text-xs uppercase tracking-wider">Total Packets</div>
        <div id="totalPackets" class="text-2xl font-bold mt-1 stat-number">0</div>
      </div>
      <div class="card">
        <div class="text-gray-400 text-xs uppercase tracking-wider">Sent</div>
        <div id="pktsSent" class="text-2xl font-bold mt-1 stat-number text-orange-400">0</div>
      </div>
      <div class="card">
        <div class="text-gray-400 text-xs uppercase tracking-wider">Received</div>
        <div id="pktsRecv" class="text-2xl font-bold mt-1 stat-number text-emerald-400">0</div>
      </div>
      <div class="card relative overflow-hidden">
        <div class="text-gray-400 text-xs uppercase tracking-wider">Live Bandwidth</div>
        <div class="absolute bottom-0 left-0 right-0 h-12 opacity-50">
           <canvas id="sparklineChart"></canvas>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="card lg:col-span-2">
        <h3 class="text-sm text-gray-400 mb-4">Traffic Volume (Bytes/sec)</h3>
        <div class="h-64">
          <canvas id="bandwidthChart"></canvas>
        </div>
      </div>
      <div class="card">
        <h3 class="text-sm text-gray-400 mb-4">Top Protocols</h3>
        <div class="h-48 flex justify-center">
          <canvas id="protocolChart"></canvas>
        </div>
        <div class="mt-4 border-t border-gray-700 pt-4">
            <h3 class="text-sm text-gray-400 mb-2">Top Ports</h3>
            <ul id="topPortsList" class="text-xs space-y-1 text-gray-300"></ul>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="card p-0 overflow-hidden h-80 relative">
         <div id="map" class="w-full h-full z-0"></div>
         <div class="absolute top-2 right-2 z-10 bg-slate-900/80 p-2 rounded text-xs backdrop-blur">
            Active Sources
         </div>
      </div>
      <div class="card">
        <h3 class="text-sm text-gray-400 mb-2">Live Traffic Flows</h3>
        <div id="flowList" class="h-72 overflow-y-auto custom-scroll text-xs font-mono space-y-1"></div>
      </div>
    </div>

    <div class="card">
      <h3 class="text-sm text-gray-400 mb-2 flex justify-between">
        <span>Live Packet Stream</span>
        <span class="text-blue-400 animate-pulse">● Live</span>
      </h3>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs">
          <thead class="text-gray-500 border-b border-gray-700">
            <tr>
              <th class="pb-2">Time</th>
              <th class="pb-2">Source</th>
              <th class="pb-2">Dest</th>
              <th class="pb-2">Proto</th>
              <th class="pb-2">Size</th>
              <th class="pb-2">Process</th>
            </tr>
          </thead>
          <tbody id="packetTableBody" class="font-mono text-gray-300"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // --- 1. Socket & State ---
    const socket = io();
    let charts = {};
    let map, markers = [];
    let isCapturing = false;

    // --- 2. Socket Events ---
    socket.on('connect', () => {
      document.getElementById('wsStatus').className = 'w-2 h-2 rounded-full bg-green-500';
      document.getElementById('wsStatusText').innerText = 'Connected';
      console.log("WebSocket Connected");
    });

    socket.on('disconnect', () => {
      document.getElementById('wsStatus').className = 'w-2 h-2 rounded-full bg-red-500';
      document.getElementById('wsStatusText').innerText = 'Disconnected';
    });

    // THE MAIN EVENT LOOP
    socket.on('stats_update', (data) => {
      if (!data) return;

      // KPIs
      document.getElementById('totalPackets').innerText = data.total_packets.toLocaleString();
      document.getElementById('pktsSent').innerText = data.packet_directions.sent.toLocaleString();
      document.getElementById('pktsRecv').innerText = data.packet_directions.received.toLocaleString();

      // Update Charts
      updateCharts(data);

      // Update Map
      updateMap(data.geo_points);

      // Update Lists
      updateFlowList(data.traffic_flows);
      updatePacketTable(data.detailed_packets);
      updatePorts(data.top_ports);
    });

    // --- 3. API Calls ---
    async function showInterfaceModal() {
        const modal = document.getElementById('interfaceModal');
        const list = document.getElementById('interfaceList');
        modal.classList.remove('hidden');
        list.innerHTML = 'Loading interfaces...';
        
        const res = await fetch('/api/interfaces');
        const data = await res.json();
        
        list.innerHTML = '';
        data.interfaces.forEach(iface => {
            const div = document.createElement('div');
            div.className = "p-2 bg-slate-800 hover:bg-slate-700 rounded cursor-pointer border border-slate-700 transition";
            div.innerText = iface;
            div.onclick = () => startCapture(iface);
            list.appendChild(div);
        });
    }

    async function startCapture(iface) {
        document.getElementById('interfaceModal').classList.add('hidden');
        const res = await fetch('/api/start', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({interface: iface})
        });
        const data = await res.json();
        console.log("Capture started:", data);
        isCapturing = true;
    }

    async function stopCapture() {
        await fetch('/api/stop', {method: 'POST'});
        isCapturing = false;
    }

    // --- 4. Visualization Logic ---

    function updateCharts(data) {
        // Bandwidth Chart
        const bwData = data.bandwidth || [];
        const labels = bwData.map((_, i) => i);
        
        if(!charts.bandwidth) {
            const ctx = document.getElementById('bandwidthChart').getContext('2d');
            charts.bandwidth = new Chart(ctx, {
                type: 'line',
                data: { labels: labels, datasets: [{ label: 'Bytes', data: bwData, borderColor: '#60a5fa', tension: 0.4, fill: true, backgroundColor: 'rgba(96, 165, 250, 0.1)' }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: {display: false} }, scales: { x: {display: false}, y: { grid: {color: '#334155'} } } }
            });
        } else {
            charts.bandwidth.data.labels = labels;
            charts.bandwidth.data.datasets[0].data = bwData;
            charts.bandwidth.update('none'); // 'none' mode for performance
        }

        // Sparkline
        if(!charts.spark) {
             charts.spark = new Chart(document.getElementById('sparklineChart'), {
                type: 'line',
                data: { labels: labels, datasets: [{ data: bwData, borderColor: '#a78bfa', borderWidth: 1, pointRadius: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: {display: false} }, scales: { x: {display: false}, y: {display: false} } }
             });
        } else {
            charts.spark.data.labels = labels;
            charts.spark.data.datasets[0].data = bwData;
            charts.spark.update('none');
        }

        // Protocol Doughnut
        const pLabels = Object.keys(data.protocols);
        const pData = Object.values(data.protocols);
        if(!charts.proto) {
            charts.proto = new Chart(document.getElementById('protocolChart'), {
                type: 'doughnut',
                data: { labels: pLabels, datasets: [{ data: pData, backgroundColor: ['#60a5fa', '#34d399', '#f87171', '#fbbf24'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: {position: 'right', labels: {color: '#94a3b8', font:{size: 10}}} } }
            });
        } else {
            charts.proto.data.labels = pLabels;
            charts.proto.data.datasets[0].data = pData;
            charts.proto.update();
        }
    }

    function updatePorts(ports) {
        const list = document.getElementById('topPortsList');
        list.innerHTML = ports.map(([port, count]) => 
            `<li class="flex justify-between"><span>Port ${port}</span><span class="text-gray-500">${count}</span></li>`
        ).join('');
    }

    function updateFlowList(flows) {
        const div = document.getElementById('flowList');
        if(!flows.length) { div.innerHTML = '<div class="text-gray-500 italic">Waiting for traffic...</div>'; return; }
        
        div.innerHTML = flows.map(([key, packets, bytes]) => {
            const [src, dst] = key.split(':');
            return `
            <div class="flex justify-between items-center p-2 hover:bg-slate-800 rounded border-b border-slate-800/50">
                <div>
                    <div class="text-blue-300">${src} <span class="text-gray-500">→</span></div>
                    <div class="text-emerald-300">${dst}</div>
                </div>
                <div class="text-right">
                    <div>${packets} pkts</div>
                    <div class="text-gray-500">${formatBytes(bytes)}</div>
                </div>
            </div>`;
        }).join('');
    }

    function updatePacketTable(packets) {
        const tbody = document.getElementById('packetTableBody');
        // Keep only last 15 in DOM for performance
        const recent = packets.slice(0, 15);
        tbody.innerHTML = recent.map(p => `
            <tr class="border-b border-slate-800/50 hover:bg-slate-800/50 transition">
                <td class="py-1 text-gray-500">${new Date(p.timestamp*1000).toLocaleTimeString().split(' ')[0]}</td>
                <td class="py-1 text-blue-400">${p.src}</td>
                <td class="py-1 text-emerald-400">${p.dst}</td>
                <td class="py-1"><span class="px-1 rounded bg-slate-700 text-[10px]">${p.protocol}</span></td>
                <td class="py-1 text-gray-400">${p.size}</td>
                <td class="py-1 text-orange-300">${p.process || '-'}</td>
            </tr>
        `).join('');
    }

    function updateMap(points) {
        if(!map) {
            map = L.map('map', {zoomControl:false, attributionControl:false}).setView([20, 0], 2);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {maxZoom: 19}).addTo(map);
        }
        // Clear old markers
        markers.forEach(m => map.removeLayer(m));
        markers = [];
        
        points.forEach(p => {
            const m = L.circleMarker([p.lat, p.lon], {
                radius: 5, fillColor: '#34d399', color: '#fff', weight: 1, fillOpacity: 0.7
            }).bindPopup(`${p.city}, ${p.country}<br>IP: ${p.ip}`).addTo(map);
            markers.push(m);
        });
    }

    function formatBytes(bytes, decimals = 2) {
        if (!+bytes) return '0 B';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
    }
  </script>
</body>
</html>
